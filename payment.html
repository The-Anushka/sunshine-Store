  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sunshine Store — Payment</title>

 

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  
  <header class="site-header">
    <div class="brand"><a href="index.html">☀️ Sunshine Store</a></div>
    <nav class="nav"><a href="index.html">Home</a><a href="product.html">Products</a><a href="cart.html">Cart</a></nav>
  </header>

  <main>
    <section class="payment-page">
      <h1>Payment</h1>
      <form id="payment-form" class="payment-form" onsubmit="return handlePayment(event);">
        <input type="text" id="fullName" placeholder="Full name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="cardNumber" placeholder="Card number (mock)" required>
        <div class="two-col">
          <input type="text" id="expiry" placeholder="MM/YY" required>
          <input type="text" id="cvv" placeholder="CVV" required>
        </div>
        <button type="submit" class="btn primary">Pay Now</button>
      </form>
      <p class="notice">This is a demo payment page — no real payments are processed.</p>
    </section>
  </main>

  <footer class="site-footer">© 2025 Sunshine Store</footer>

  <script src="scripts.js"></script>
  <script>
    function handlePayment(e){
      e.preventDefault();
      // Push a GTM event when user completes payment form
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'payment_submitted',
        payment_method: 'card',
        amount: localStorage.getItem('sun_cart_total') || '0'
      });
      // Clear cart (frontend demo)
      localStorage.removeItem('sun_cart');
      localStorage.removeItem('sun_cart_total');
      // Redirect to success page
      window.location.href = 'success.html';
      return false;
    }
  </script>
</body>
</html>
