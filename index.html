    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #fceabb, #f8b500);
            color: #333;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }
        .hero h2 {
            font-size: 48px;
        }
        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .hero img {
            width: 70%;
            max-width: 500px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            background: white;
            color: #f8b500;
            font-weight: 600;
        }

        /* IMAGE SECTION */
        .image-section {
            text-align: center;
            margin: 60px 0;
        }

        .image-section img {
            width: 85%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        /* FEATURES */
        .features {
            padding: 50px 20px;
            text-align: center;
            background: white;
            border-radius: 20px 20px 0 0;
            margin-top: 40px;
        }

        .card {
            background: #fff4d4;
            padding: 25px;
            width: 280px;
            border-radius: 15px;
            margin: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            height: 180px;
            object-fit: cover;
        }

        .feature-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .hero h2 { font-size: 34px; }
            .hero img { width: 90%; }
        }
    </style>

    </header>
